<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>College 3D Campus Map</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#07111f;color:#eef6ff}#app{width:100%;height:100%;position:relative}canvas{display:block}.panel{position:absolute;z-index:5;top:16px;left:16px;width:350px;padding:17px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(8,20,35,.9);backdrop-filter:blur(14px);box-shadow:0 18px 60px rgba(0,0,0,.35)}h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;color:#9fb0c3;margin-bottom:13px}input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #30465e;background:#0d1c2d;color:#fff;outline:none}.filters,.floors{display:flex;gap:6px;margin-top:9px}.filters button,.floors button{flex:1;text-align:center;padding:7px 4px;font-size:11px}.list{margin-top:10px;display:grid;gap:7px;max-height:36vh;overflow:auto}button{width:100%;text-align:left;padding:10px;border:1px solid #263d55;border-radius:10px;background:#10243a;color:#eaf4ff;cursor:pointer}button:hover,button.active{background:#173b59}.empty{padding:12px;color:#91a5b8;text-align:center;font-size:12px}.floorTitle{font-size:11px;color:#91a5b8;margin-top:12px}.info{position:absolute;z-index:5;right:18px;bottom:18px;width:325px;padding:17px;border-radius:16px;background:rgba(8,20,35,.92);border:1px solid rgba(255,255,255,.12);display:none}.info.show{display:block}.info h2{margin:0 0 5px;font-size:19px}.info p{margin:6px 0;color:#aebed0;font-size:13px;line-height:1.45}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#183b5d;color:#8ed0ff;font-size:11px;margin-top:7px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{padding:8px;text-align:center;font-size:12px}.hint{position:absolute;z-index:4;right:18px;top:18px;padding:9px 12px;border-radius:10px;background:rgba(8,20,35,.72);font-size:12px;color:#aebed0}.legend{font-size:11px;color:#91a5b8;margin-top:9px;line-height:1.45}@media(max-width:600px){.panel{width:calc(100% - 24px);top:12px;left:12px;padding:14px}.hint{display:none}.info{left:12px;right:12px;bottom:12px;width:auto}.list{max-height:25vh}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"}}</script></head><body><div id="app"><div class="panel"><h1>College 3D Campus</h1><div class="sub">Interactive campus navigation prototype</div><input id="search" placeholder="Search building, department or room..."/><div class="filters"><button data-filter="All" class="active">All</button><button data-filter="Academic">Academic</button><button data-filter="Student">Student</button><button data-filter="Facilities">Facilities</button></div><div id="list" class="list"></div><div id="floorArea" style="display:none"><div class="floorTitle">Selected building floors</div><div id="floors" class="floors"></div></div><div class="legend">Click a building or room. Drag to rotate · Wheel to zoom · Right-drag to pan.</div></div><div class="hint">3D Campus · Navigation Demo</div><div id="info" class="info"><h2 id="infoTitle"></h2><p id="infoText"></p><span id="infoType" class="badge"></span><div class="actions"><button id="focusBtn">Focus</button><button id="closeBtn">Close</button></div></div></div>
<script type="module">import * as THREE from 'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js';
const buildings=[
{id:'main',name:'Main Building',type:'Administration',group:'Facilities',department:'Administration',x:-14,z:-7,w:13,d:8,h:5,desc:'Main entrance, administration office and reception.',floors:3,rooms:['Principal Office','Administration','Accounts']},
{id:'science',name:'Science Block',type:'Academic',group:'Academic',department:'Physics Chemistry Computer Science',x:3,z:-7,w:12,d:8,h:7,desc:'Physics, Chemistry and Computer Science classrooms.',floors:3,rooms:['CS Classroom 101','Physics Lab 201','Chemistry Lab 202','CS Lab 301','CS Lab 302']},
{id:'library',name:'Library',type:'Learning',group:'Student',department:'Library Reading Digital Resources',x:-13,z:6,w:9,d:7,h:4,desc:'Central library with reading area and digital resources.',floors:2,rooms:['Reference Section','Reading Hall','Digital Library']},
{id:'lab',name:'Computer Lab',type:'Laboratory',group:'Academic',department:'Computer Science CS Practical Lab',x:0,z:7,w:10,d:7,h:4,desc:'Computer Science laboratory for practical sessions and examinations.',floors:1,rooms:['Computer Lab 1','Computer Lab 2','Project Lab']},
{id:'aud',name:'Auditorium',type:'Events',group:'Student',department:'Seminars Events Examination',x:13,z:5,w:9,d:9,h:6,desc:'Auditorium for seminars, events and examinations.',floors:2,rooms:['Main Hall','Seminar Room','Green Room']},
{id:'canteen',name:'Canteen',type:'Food & Student Area',group:'Student',department:'Food Common Area',x:-1,z:15,w:9,d:5,h:2.5,desc:'Student canteen and common seating area.',floors:1,rooms:['Dining Area','Kitchen']},
{id:'sports',name:'Sports Ground',type:'Sports',group:'Student',department:'Sports Activities',x:11,z:-10,w:18,d:7,h:.3,desc:'Outdoor sports and student activities area.',floors:0,rooms:[]},
{id:'parking',name:'Parking',type:'Parking',group:'Facilities',department:'Staff Student Parking',x:-15,z:15,w:11,d:5,h:.2,desc:'Student and staff parking area.',floors:0,rooms:[]}
];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);scene.fog=new THREE.Fog(0x07111f,60,115);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);camera.position.set(30,28,34);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('app').prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.05;
scene.add(new THREE.HemisphereLight(0xbddcff,0x263442,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(25,40,15);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x183526,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(90,45,0x31506a,0x203849);grid.position.y=.03;scene.add(grid);const pathMat=new THREE.MeshStandardMaterial({color:0x8b877c});for(const[x,z,w,d]of[[0,0,4,42],[0,0,42,4]]){const p=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),pathMat);p.position.set(x,.06,z);scene.add(p)}
function label(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='rgba(7,17,31,.85)';ctx.roundRect(4,10,504,76,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText(text,256,59);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(7,1.3,1);s.position.set(x,y,z);scene.add(s);return s}
function addBuilding(b){const g=new THREE.Group();g.userData=b;const mat=new THREE.MeshStandardMaterial({color:b.id==='sports'?0x3d8a52:0x6f9bb5,roughness:.7});const body=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d),mat);body.position.y=b.h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);if(b.h>.5){const roof=new THREE.Mesh(new THREE.BoxGeometry(b.w+.45,.42,b.d+.45),new THREE.MeshStandardMaterial({color:0x244a63}));roof.position.y=b.h+.21;roof.castShadow=true;g.add(roof);for(let floor=0;floor<Math.max(1,b.floors);floor++){const y=.85+floor*(b.h/Math.max(1,b.floors));for(let i=0;i<4;i++){const win=new THREE.Mesh(new THREE.BoxGeometry(1.25,.7,.08),new THREE.MeshStandardMaterial({color:0xbee7ff,metalness:.1,roughness:.2}));win.position.set(-b.w/2+2+i*3,y,-b.d/2-.045);g.add(win)}}}g.position.set(b.x,0,b.z);scene.add(g);b.mesh=g;b.label=label(b.name,b.x,b.h+2,b.z)}buildings.forEach(addBuilding);
for(let i=0;i<38;i++){const x=(Math.random()-.5)*76,z=(Math.random()-.5)*76;if(Math.abs(x)<25&&Math.abs(z)<20)continue;const t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,1.6,8),new THREE.MeshStandardMaterial({color:0x60442f}));tr.position.y=.8;const cr=new THREE.Mesh(new THREE.SphereGeometry(1.3,12,10),new THREE.MeshStandardMaterial({color:0x2d7442}));cr.position.y=2.1;t.add(tr,cr);t.position.set(x,0,z);scene.add(t)}
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();let selected=null,currentFilter='All',roomMeshes=[];
function clearRooms(){roomMeshes.forEach(x=>scene.remove(x));roomMeshes=[]}function showFloors(b){const area=document.getElementById('floorArea'),fs=document.getElementById('floors');fs.innerHTML='';if(!b.floors){area.style.display='none';return}area.style.display='block';for(let i=1;i<=b.floors;i++){const btn=document.createElement('button');btn.textContent='Floor '+i;btn.onclick=()=>showFloor(b,i);fs.appendChild(btn)}}
function showFloor(b,floor){clearRooms();const y=Math.max(.4,(floor-.5)*(b.h/b.floors));const rooms=b.rooms;rooms.forEach((r,i)=>{const cols=2,rows=Math.ceil(rooms.length/cols),rw=b.w*.38,rd=b.d*.32;const x=b.x+(i%cols?b.w*.2:-b.w*.2),z=b.z+(Math.floor(i/cols)-(rows-1)/2)*rd*1.5;const m=new THREE.Mesh(new THREE.BoxGeometry(rw,.18,rd),new THREE.MeshStandardMaterial({color:0xf0b84b,transparent:true,opacity:.85}));m.position.set(x,y+.2,z);m.userData={room:r,b};scene.add(m);roomMeshes.push(m);label(r,x,y+1.2,z)});camera.position.set(b.x+12,Math.max(10,b.h+8),b.z+12);controls.target.set(b.x,y,b.z)}
function focus(b){selected=b;document.getElementById('infoTitle').textContent=b.name;document.getElementById('infoText').textContent=b.desc+(b.floors?` ${b.floors} floor${b.floors>1?'s':''}.`:'');document.getElementById('infoType').textContent=b.type;document.getElementById('info').classList.add('show');showFloors(b);controls.target.set(b.x,1,b.z);camera.position.set(b.x+16,14,b.z+16);renderList(document.getElementById('search').value)}
renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects([...buildings.map(b=>b.mesh),...roomMeshes],true);if(!hits.length)return;const o=hits[0].object;if(o.userData.room){document.getElementById('infoTitle').textContent=o.userData.room;document.getElementById('infoText').textContent='Room in '+o.userData.b.name+'. Use the building/floor selector to explore this location.';document.getElementById('infoType').textContent='Room';document.getElementById('info').classList.add('show')}else{let g=o;while(g.parent&&!g.userData?.id)g=g.parent;if(g.userData?.id)focus(g.userData)}});
const list=document.getElementById('list'),search=document.getElementById('search');function renderList(q=''){const query=q.toLowerCase().trim();list.innerHTML='';const matches=buildings.filter(b=>(currentFilter==='All'||b.group===currentFilter)&&(query===''||[b.name,b.type,b.department,b.desc,...b.rooms].some(v=>v.toLowerCase().includes(query))));if(!matches.length){list.innerHTML='<div class="empty">No campus location found.</div>';return}matches.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.name+(b===selected?'  ✓':'');if(b===selected)btn.classList.add('active');btn.onclick=()=>focus(b);list.appendChild(btn)})}search.oninput=()=>renderList(search.value);document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{currentFilter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));renderList(search.value)});document.getElementById('focusBtn').onclick=()=>selected&&focus(selected);document.getElementById('closeBtn').onclick=()=>document.getElementById('info').classList.remove('show');renderList();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>
