<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College 3D Campus</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;color:#eef6ff;font-family:Inter,system-ui,Arial}#app{height:100%;position:relative}canvas{width:100%;height:100%;display:block;cursor:grab}canvas.drag{cursor:grabbing}.panel{position:absolute;z-index:4;top:14px;left:14px;width:365px;max-height:calc(100vh - 28px);overflow:auto;padding:17px;border:1px solid #30445a;border-radius:18px;background:#081423ee;backdrop-filter:blur(12px);box-shadow:0 18px 60px #0008}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#9fb0c3;margin:4px 0 13px}input,select,button{width:100%;padding:10px 11px;border-radius:10px;border:1px solid #30465e;background:#0d1c2d;color:#fff;outline:none}button{cursor:pointer;background:#10243a}button:hover,button.active{background:#173b59}.filters,.routeBtns{display:flex;gap:6px;margin-top:8px}.filters button,.routeBtns button{font-size:11px;padding:8px}.list{display:grid;gap:6px;margin-top:9px;max-height:24vh;overflow:auto}.list button{text-align:left}.route{border-top:1px solid #263b50;margin-top:12px;padding-top:11px}.title{font-size:11px;color:#91a5b8;margin-bottom:6px}.status{font-size:11px;color:#b8c8d8;margin-top:8px;line-height:1.45}.steps{display:none;margin-top:7px}.steps.show{display:block}.step{padding:6px 0;border-top:1px solid #1d3042;font-size:11px}.info{display:none;position:absolute;z-index:5;right:16px;bottom:16px;width:330px;padding:16px;border-radius:16px;background:#081423f5;border:1px solid #30445a}.info.show{display:block}.info h2{margin:0 0 5px;font-size:19px}.info p{font-size:13px;color:#aebed0;line-height:1.45}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#183b5d;color:#8ed0ff;font-size:11px}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1}.hint{position:absolute;right:16px;top:16px;padding:8px 11px;border-radius:10px;background:#081423cc;font-size:11px;color:#aebed0}.error{position:absolute;right:16px;top:55px;padding:10px 13px;border-radius:10px;background:#5b2028;color:#ffd9dd;font-size:12px}@media(max-width:600px){.panel{width:calc(100% - 20px);left:10px;top:10px;max-height:58vh;padding:13px}.hint{display:none}.info{left:10px;right:10px;bottom:10px;width:auto}}</style></head><body><div id="app"><canvas id="map"></canvas><div class="panel"><h1>College 3D Campus</h1><div class="sub">Standalone 3D campus navigation — no external 3D library required</div><input id="search" placeholder="Search building, department or room..."><div class="filters"><button data-f="All" class="active">All</button><button data-f="Academic">Academic</button><button data-f="Student">Student</button><button data-f="Facilities">Facilities</button></div><div id="list" class="list"></div><div class="route"><div class="title">Campus Navigation</div><select id="destination"><option value="">Choose destination</option></select><div class="routeBtns"><button id="routeBtn">🧭 Show Route</button><button id="clear">Clear</button></div><div id="status" class="status">Start: Main Gate · Ready</div><div id="steps" class="steps"></div></div></div><div class="hint">Drag = rotate · Wheel = zoom · Double-click = reset</div><div id="error" class="error" style="display:none"></div><div id="info" class="info"><h2 id="it"></h2><p id="ip"></p><span id="ib" class="badge"></span><div class="actions"><button id="focus">Focus</button><button id="close">Close</button></div></div></div><script>
const C=document.getElementById('map'),ctx=C.getContext('2d');let W,H,dpr;const buildings=[
{id:'main',name:'Main Building',type:'Administration',group:'Facilities',department:'Administration',x:-14,z:-7,w:13,d:8,h:5,rooms:['Principal Office','Administration','Accounts']},
{id:'science',name:'Science Block',type:'Academic',group:'Academic',department:'Physics Chemistry Computer Science',x:3,z:-7,w:12,d:8,h:7,rooms:['CS Classroom 101','Physics Lab 201','Chemistry Lab 202','CS Lab 301','CS Lab 302','5th Floor CS Department','CS Lab 2']},
{id:'library',name:'Library',type:'Learning',group:'Student',department:'Library Reading Digital Resources',x:-13,z:6,w:9,d:7,h:4,rooms:['Reference Section','Reading Hall','Digital Library']},
{id:'lab',name:'Computer Lab',type:'Laboratory',group:'Academic',department:'Computer Science CS Practical Lab',x:0,z:7,w:10,d:7,h:4,rooms:['Computer Lab 1','Computer Lab 2','Project Lab']},
{id:'aud',name:'Auditorium',type:'Events',group:'Student',department:'Seminars Events Examination',x:13,z:5,w:9,d:9,h:6,rooms:['Main Hall','Seminar Room']},
{id:'canteen',name:'Canteen',type:'Food & Student Area',group:'Student',department:'Food Common Area',x:-1,z:15,w:9,d:5,h:2.5,rooms:['Dining Area','Kitchen']},
{id:'sports',name:'Sports Ground',type:'Sports',group:'Student',department:'Sports Activities',x:11,z:-10,w:18,d:7,h:.3,rooms:[]},
{id:'parking',name:'Parking',type:'Parking',group:'Facilities',department:'Staff Student Parking',x:-15,z:15,w:11,d:5,h:.2,rooms:[]}
];const gate={x:-27,z:-18};const nodes={gate:[-27,-18],junction:[-20,-10],main:[-14,-7],center:[0,0],science:[3,-7],library:[-13,6],lab:[0,7],aud:[13,5],canteen:[-1,15],sports:[11,-10],parking:[-15,15]};const edges=[['gate','junction'],['junction','main'],['junction','center'],['center','science'],['center','lab'],['main','library'],['library','lab'],['lab','canteen'],['center','aud'],['science','aud'],['aud','sports'],['main','parking'],['library','parking'],['parking','canteen']];let yaw=.72,pitch=.72,zoom=22,drag=false,lx=0,ly=0,route=null,selected=null,filter='All';
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);function proj(x,y,z){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cp-Z*sp,D=Y*0+Z*cp;return [W/2+X*zoom,H/2-Y*zoom*.95]}function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}function cube(b){const p=[proj(b.x-b.w/2,0,b.z-b.d/2),proj(b.x+b.w/2,0,b.z-b.d/2),proj(b.x+b.w/2,0,b.z+b.d/2),proj(b.x-b.w/2,0,b.z+b.d/2)];const q=p.map(a=>proj((a[0]-W/2)/zoom, b.h, (a[1]-H/2)/zoom));poly([p[0],p[1],q[1],q[0]],b===selected?'#8bbfe0':'#557d96');poly([p[1],p[2],q[2],q[1]],b===selected?'#668fa8':'#3f647a');poly([q[0],q[1],q[2],q[3]],'#274b62');const c=proj(b.x,b.h+.7,b.z);ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(b.name,c[0],c[1])}function pathPoints(ids,y=.25){return ids.map(id=>{const n=nodes[id];return proj(n[0],y,n[1])})}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#07111f';ctx.fillRect(0,0,W,H);for(let x=-45;x<=45;x+=5){for(let z=-45;z<=45;z+=5){const a=proj(x,0,z);ctx.fillStyle='#173124';ctx.fillRect(a[0],a[1],1,1)}}for(let i=-40;i<=40;i+=5){const a=proj(i,.02,0),b=proj(0,.02,i);ctx.strokeStyle='#243b31';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}for(const e of edges){const a=proj(nodes[e[0]][0],.08,nodes[e[0]][1]),b=proj(nodes[e[1]][0],.08,nodes[e[1]][1]);ctx.strokeStyle='#a49f91';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}if(route){const ps=pathPoints(route);ctx.strokeStyle='#4fc3ff';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.lineCap='butt'}[...buildings].sort((a,b)=>a.z-b.z).forEach(cube);const g=proj(gate.x,.8,gate.z);ctx.fillStyle='#4fc3ff';ctx.beginPath();ctx.arc(g[0],g[1],8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('MAIN GATE',g[0],g[1]-14)}function neighbors(id){return edges.flatMap(e=>e[0]===id?[e[1]]:e[1]===id?[e[0]]:[])}function dist(a,b){return Math.hypot(nodes[a][0]-nodes[b][0],nodes[a][1]-nodes[b][1])}function shortest(end){const D={},P={},U=new Set(Object.keys(nodes));Object.keys(nodes).forEach(n=>D[n]=Infinity);D.gate=0;while(U.size){let u=null;for(const n of U)if(u===null||D[n]<D[u])u=n;if(u===null)break;U.delete(u);if(u===end)break;neighbors(u).forEach(v=>{const nd=D[u]+dist(u,v);if(nd<D[v]){D[v]=nd;P[v]=u}})}const a=[];let c=end;if(c!=='gate'&&P[c]===undefined)return a;while(c){a.unshift(c);if(c==='gate')break;c=P[c]}return a}function showInfo(b){selected=b;document.getElementById('it').textContent=b.name;document.getElementById('ip').textContent=b.department+' · '+b.rooms.length+' listed locations.';document.getElementById('ib').textContent=b.type;document.getElementById('info').classList.add('show');draw();render()}function render(){const q=document.getElementById('search').value.toLowerCase();const list=document.getElementById('list');list.innerHTML='';const ms=buildings.filter(b=>(filter==='All'||b.group===filter)&&(!q||[b.name,b.type,b.department,...b.rooms].join(' ').toLowerCase().includes(q)));if(!ms.length){list.innerHTML='<div style="font-size:11px;color:#91a5b8;padding:8px">No location found.</div>';return}ms.forEach(b=>{const x=document.createElement('button');x.textContent=b.name+(b===selected?' ✓':'');x.onclick=()=>showInfo(b);list.appendChild(x)})}buildings.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;document.getElementById('destination').appendChild(o)});document.getElementById('search').oninput=render;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('routeBtn').onclick=()=>{const b=buildings.find(x=>x.id===document.getElementById('destination').value);if(!b)return;route=shortest(b.id);document.getElementById('status').textContent='Main Gate → '+b.name+' · '+Math.max(1,route.length-1)+' walking segments';const s=document.getElementById('steps');s.innerHTML=route.map((n,i)=>'<div class="step">'+(i+1)+'. '+(n==='gate'?'Start at Main Gate':n==='junction'?'Campus Junction':n==='center'?'Central Walkway':buildings.find(b=>b.id===n)?.name||n)+'</div>').join('');s.classList.add('show');draw()};document.getElementById('clear').onclick=()=>{route=null;document.getElementById('steps').classList.remove('show');document.getElementById('status').textContent='Start: Main Gate · Ready';draw()};document.getElementById('focus').onclick=()=>selected&&showInfo(selected);document.getElementById('close').onclick=()=>document.getElementById('info').classList.remove('show');C.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;C.classList.add('drag')});addEventListener('pointerup',()=>{drag=false;C.classList.remove('drag')});addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.008;pitch=Math.max(.35,Math.min(1.15,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;draw()});C.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(10,Math.min(38,zoom*(e.deltaY>0?.92:1.08)));draw()},{passive:false});C.addEventListener('dblclick',()=>{yaw=.72;pitch=.72;zoom=22;draw()});C.addEventListener('click',e=>{if(drag)return;let best=null,bd=24;for(const b of buildings){const p=proj(b.x,b.h/2,b.z),d=Math.hypot(e.clientX-p[0],e.clientY-p[1]);if(d<bd){best=b;bd=d}}if(best)showInfo(best)});resize();render();
</script></body></html>
