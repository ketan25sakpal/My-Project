<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College 3D Campus Map</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#07111f;color:#eef6ff}
    #app{width:100%;height:100%;position:relative}canvas{display:block}
    .panel{position:absolute;z-index:5;top:18px;left:18px;width:310px;padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(8,20,35,.86);backdrop-filter:blur(14px);box-shadow:0 18px 60px rgba(0,0,0,.35)}
    h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;color:#9fb0c3;margin-bottom:15px}
    input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #30465e;background:#0d1c2d;color:#fff;outline:none}.list{margin-top:10px;display:grid;gap:7px;max-height:48vh;overflow:auto}
    button{width:100%;text-align:left;padding:10px;border:1px solid #263d55;border-radius:10px;background:#10243a;color:#eaf4ff;cursor:pointer}button:hover{background:#17324e}
    .info{position:absolute;z-index:5;right:18px;bottom:18px;width:290px;padding:15px;border-radius:16px;background:rgba(8,20,35,.88);border:1px solid rgba(255,255,255,.12);display:none}.info.show{display:block}.info h2{margin:0 0 6px;font-size:18px}.info p{margin:4px 0;color:#aebed0;font-size:13px;line-height:1.45}
    .hint{position:absolute;z-index:4;right:18px;top:18px;padding:9px 12px;border-radius:10px;background:rgba(8,20,35,.72);font-size:12px;color:#aebed0}
    .badge{display:inline-block;padding:3px 7px;border-radius:20px;background:#183b5d;color:#8ed0ff;font-size:11px;margin-top:8px}
  </style>
</head>
<body>
<div id="app">
  <div class="panel"><h1>College 3D Campus</h1><div class="sub">Interactive campus demonstration</div><input id="search" placeholder="Search building..." /><div id="list" class="list"></div></div>
  <div class="hint">Drag = rotate · Wheel = zoom · Right drag = pan</div>
  <div id="info" class="info"><h2 id="infoTitle"></h2><p id="infoText"></p><span id="infoType" class="badge"></span></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js';

const buildings=[
 {name:'Main Building',type:'Administration',x:-14,z:-7,w:13,d:8,h:5,desc:'Main entrance, administration office and reception.'},
 {name:'Science Block',type:'Academic',x:3,z:-7,w:12,d:8,h:7,desc:'Physics, Chemistry and Computer Science classrooms.'},
 {name:'Library',type:'Learning',x:-13,z:6,w:9,d:7,h:4,desc:'Central library with reading area and digital resources.'},
 {name:'Computer Lab',type:'Laboratory',x:0,z:7,w:10,d:7,h:4,desc:'Computer laboratory for practical sessions.'},
 {name:'Auditorium',type:'Events',x:13,z:5,w:9,d:9,h:6,desc:'Auditorium for seminars, events and examinations.'},
 {name:'Sports Ground',type:'Sports',x:11,z:-9,w:18,d:7,h:.3,desc:'Outdoor sports and student activities area.'}
];
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07111f); scene.fog=new THREE.Fog(0x07111f,55,110);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300); camera.position.set(30,30,34);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.getElementById('app').prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,0,0); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.05;
scene.add(new THREE.HemisphereLight(0xbddcff,0x263442,2)); const sun=new THREE.DirectionalLight(0xffffff,3); sun.position.set(25,40,15); sun.castShadow=true; scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x183526,roughness:1})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(90,45,0x31506a,0x203849); grid.position.y=.03; scene.add(grid);
function addBox(b){const g=new THREE.Group(); const body=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d),new THREE.MeshStandardMaterial({color:0x7aa6c2,roughness:.75})); body.position.y=b.h/2; body.castShadow=true; body.receiveShadow=true; g.add(body); const roof=new THREE.Mesh(new THREE.BoxGeometry(b.w+.4,.45,b.d+.4),new THREE.MeshStandardMaterial({color:0x244a63})); roof.position.y=b.h+.22; roof.castShadow=true; g.add(roof); g.position.set(b.x,0,b.z); g.userData=b; scene.add(g); b.mesh=g;}
buildings.forEach(addBox);
// paths
const pathMat=new THREE.MeshStandardMaterial({color:0x8b877c});
for(const [x,z,w,d] of [[0,0,4,42],[0,0,42,4]]){const p=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),pathMat);p.position.set(x,.06,z);scene.add(p)}
// trees
for(let i=0;i<30;i++){const x=(Math.random()-.5)*70,z=(Math.random()-.5)*70;if(Math.abs(x)<24&&Math.abs(z)<16)continue;const t=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,1.6,8),new THREE.MeshStandardMaterial({color:0x60442f}));trunk.position.y=.8;const crown=new THREE.Mesh(new THREE.SphereGeometry(1.3,12,10),new THREE.MeshStandardMaterial({color:0x2d7442}));crown.position.y=2.1;t.add(trunk,crown);t.position.set(x,0,z);scene.add(t)}
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function show(b){document.getElementById('infoTitle').textContent=b.name;document.getElementById('infoText').textContent=b.desc;document.getElementById('infoType').textContent=b.type;document.getElementById('info').classList.add('show');controls.target.set(b.x,1,b.z);camera.position.set(b.x+16,14,b.z+16)}
renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(buildings.map(b=>b.mesh),true)[0];if(hit)show(hit.object.parent.userData)});
const list=document.getElementById('list'),search=document.getElementById('search');function renderList(q=''){list.innerHTML='';buildings.filter(b=>b.name.toLowerCase().includes(q.toLowerCase())||b.type.toLowerCase().includes(q.toLowerCase())).forEach(b=>{const btn=document.createElement('button');btn.textContent=b.name;btn.onclick=()=>show(b);list.appendChild(btn)})}renderList();search.oninput=()=>renderList(search.value);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body></html>
