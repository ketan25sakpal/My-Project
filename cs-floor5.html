<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Science Department · 5th Floor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#111;color:#eef6ff}#app{height:100%;position:relative}canvas{display:block}.panel{position:absolute;z-index:5;left:16px;top:16px;width:340px;padding:17px;border:1px solid #334252;border-radius:18px;background:rgba(15,20,27,.92);backdrop-filter:blur(12px);box-shadow:0 18px 55px #0008}.panel h1{font-size:19px;margin:0 0 4px}.sub{font-size:12px;color:#aab5c0;line-height:1.45}.tag{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:20px;background:#263b50;color:#9ed9ff;font-size:11px}.buttons{display:flex;gap:7px;margin-top:13px}.buttons button{flex:1}.info{margin-top:12px;padding-top:12px;border-top:1px solid #293542;font-size:12px;color:#b8c4cf;line-height:1.5}button{border:1px solid #3a4c5f;background:#182736;color:#edf5fb;border-radius:9px;padding:9px;cursor:pointer}button:hover,button.active{background:#24435d}.hint{position:absolute;right:16px;top:16px;padding:8px 11px;background:#101923dd;border:1px solid #2d3d4c;border-radius:10px;color:#aebbc7;font-size:11px}@media(max-width:600px){.panel{left:10px;top:10px;width:calc(100% - 20px);padding:14px}.hint{display:none}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"}}</script>
</head><body><div id="app"><div class="panel"><h1>Computer Science Department</h1><div class="sub">5th Floor · Interior demonstration based on the uploaded corridor/lab reference video.</div><span class="tag">5TH FLOOR</span><div class="buttons"><button id="passage" class="active">Passage</button><button id="lab">CS Lab 2</button></div><div class="info" id="info">Corridor view: tiled floor, windows along one side, storage/cabinets along the other, and classroom doors.</div></div><div class="hint">Drag rotate · Wheel zoom · Right-drag pan</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10151b);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;controls.target.set(0,1.6,0);
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x4a4037,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,8,5);scene.add(light);
const floorMat=new THREE.MeshStandardMaterial({color:0x777875,roughness:.8}),wallMat=new THREE.MeshStandardMaterial({color:0xe6ddd2,roughness:.9}),white=new THREE.MeshStandardMaterial({color:0xf2f1ec}),frame=new THREE.MeshStandardMaterial({color:0x6c7072,metalness:.15,roughness:.55}),wood=new THREE.MeshStandardMaterial({color:0x633f2f,roughness:.75}),glass=new THREE.MeshStandardMaterial({color:0x9db9c5,roughness:.2,metalness:.05}),chairMat=new THREE.MeshStandardMaterial({color:0x9a3029,roughness:.65}),screenMat=new THREE.MeshStandardMaterial({color:0x15191d,roughness:.3});
function box(name,s,p,mat=white){const m=new THREE.Mesh(new THREE.BoxGeometry(...s),mat);m.name=name;m.position.set(...p);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function cyl(s,p,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(...s),mat);m.position.set(...p);scene.add(m);return m}
let mode='passage';const interior=new THREE.Group();scene.add(interior);function clear(){while(interior.children.length)interior.remove(interior.children[0])}
function addPassage(){clear();const W=7,L=32,H=3.4;const g=interior;const floor=box('floor',[W,.12,L],[0,0,0],floorMat);g.add(floor);const ceiling=box('ceiling',[W,.12,L],[0,H,0],white);g.add(ceiling);const left=box('left wall',[.12,H,L],[-W/2,H/2,0],wallMat);g.add(left);const right=box('right wall',[.12,H,L],[W/2,H/2,0],wallMat);g.add(right);for(let z=-14;z<=14;z+=7){const win=box('window',[.08,2.1,5.2],[-W/2+.07,1.8,z],glass);g.add(win);for(const yy of [0.75,2.85])g.add(box('frame',[.12,.06,5.3],[-W/2+.02,yy,z],frame));}for(let z=-13;z<=13;z+=6.5){const cabinet=box('cabinet',[.65,2.2,5.4],[W/2-.4,1.15,z],wood);g.add(cabinet);for(let y=.5;y<2.2;y+=.55)g.add(box('shelf',[.7,.06,5.5],[W/2-.74,y,z],frame));}for(let z=-14;z<=14;z+=7){const door=box('door',[.12,2.25,1.15],[W/2-.06,1.15,z+2],wood);g.add(door);g.add(box('doorframe',[.16,.12,1.3],[W/2-.03,2.35,z+2],frame));}for(let z=-14;z<=14;z+=2.8){g.add(box('floorTile',[W-.2,.02,2.65],[0,.08,z],new THREE.MeshStandardMaterial({color:z%5===0?0x858682:0x747673,roughness:1})));}for(let z=-12;z<=12;z+=8){g.add(box('notice',[.05,1.3,2.2],[-W/2+.15,1.7,z],new THREE.MeshStandardMaterial({color:0xefe5d4})));}camera.position.set(8,3.1,13);controls.target.set(0,1.6,0);}
function addLab(){clear();const W=15,L=13,H=3.6;const g=interior;g.add(box('lab floor',[W,.12,L],[0,0,0],floorMat));g.add(box('back wall',[W,H,.12],[0,H/2,-L/2],wallMat));g.add(box('left wall',[.12,H,L],[-W/2,H/2,0],wallMat));g.add(box('right wall',[.12,H,L],[W/2,H/2,0],wallMat));g.add(box('ceiling',[W,.12,L],[0,H,0],white));for(let z=-4;z<=4;z+=4){for(let x=-5;x<=5;x+=3.3){g.add(box('desk',[2.7,.1,.75],[x,.85,z],wood));g.add(box('monitor',[.08,.8,.65],[x,.95,z-.15],screenMat));g.add(box('monitor stand',[.18,.45,.18],[x,.62,z-.15],frame));g.add(box('chair seat',[.85,.12,.75],[x,.48,z+.75],chairMat));g.add(box('chair back',[.8,1,.12],[x,.95,z+1.05],chairMat));}}for(let x=-6;x<=6;x+=4){g.add(box('window',[3.1,1.7,.08],[x,2.05,-L/2+.07],glass));}g.add(box('teacher desk',[5,.12,1.1],[0,.9,5.1],wood));g.add(box('board',[7,2.2,.08],[0,2.05,-L/2+.2],new THREE.MeshStandardMaterial({color:0x263238})));for(let i=-5;i<=5;i+=2.5)g.add(box('ceilingLight',[1.8,.08,.5],[i,3.4,0],white));camera.position.set(16,10,16);controls.target.set(0,1.3,0)}
function setMode(m){mode=m;document.getElementById('passage').classList.toggle('active',m==='passage');document.getElementById('lab').classList.toggle('active',m==='lab');document.getElementById('info').textContent=m==='passage'?'Corridor view: tiled floor, windows along one side, storage/cabinets along the other, and classroom doors.':'CS Lab 2: rows of desktop computers, monitors, red chairs, front teaching desk and display board.';m==='passage'?addPassage():addLab()}document.getElementById('passage').onclick=()=>setMode('passage');document.getElementById('lab').onclick=()=>setMode('lab');setMode('passage');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
